<div class="drawer-head">
  <h2>Settings</h2>
  <button type="button" class="icon-btn" id="closeSettings"
    aria-label="Close settings" title="Close settings"
    (click)="close.emit()">&times;</button>
</div>

<section class="drawer-section">
  <h3>Playback</h3>
  <div appSettingsSliders></div>
  <button type="button" class="drawer-link" id="resetPacing"
    [disabled]="atPlaybackDefaults()"
    title="Back to the default speed and gap"
    (click)="resetPlayback()">Reset to playback defaults</button>
</section>
