<div class="decks-list">
  <button
    type="button"
    id="allTopics"
    [attr.aria-pressed]="selected() === null"
    title="Practise every topic"
    (click)="pick.emit(null)"
  >
    <span class="deck-name">All topics</span>
    <span class="deck-count" [class.mastered]="countLabel(null) === 'Mastered'">{{ countLabel(null) }}</span>
  </button>

  @for (topic of practice.topics(); track topic.id) {
    <button
      type="button"
      [attr.data-deck-id]="topic.id"
      [attr.aria-pressed]="topic.id === selected()"
      [title]="'Practise only ' + topic.name"
      (click)="pick.emit(topic.id)"
    >
      <span class="deck-name">{{ topic.name }}</span>
      <span class="deck-count" [class.mastered]="countLabel(topic.id) === 'Mastered'">{{ countLabel(topic.id) }}</span>
    </button>
  }
</div>
