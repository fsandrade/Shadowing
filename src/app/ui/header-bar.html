<h1>Shadowing</h1>

@if (practice.levelChosen()) {
  <button
    type="button"
    class="level-chip"
    id="levelChip"
    [title]="'Level ' + practice.level() + ' — click to change'"
    (click)="practice.clearLevel()"
  >
    <span class="level-chip-code">{{ practice.level() }}</span>
    <span class="level-chip-hint">change</span>
  </button>
}

<div class="clock" id="clock" [title]="clockTitle()">{{ timer.clockText() }}</div>

<button
  type="button"
  class="icon-btn"
  id="settings"
  aria-label="Settings"
  aria-controls="settingsDrawer"
  [attr.aria-expanded]="settingsOpen()"
  title="Session length, playback and practice options"
  (click)="toggleSettings.emit()"
>&#9881;</button>

<div appAccountMenu (openSettings)="toggleSettings.emit()"></div>

<button
  type="button"
  class="icon-btn"
  id="help"
  aria-label="How to use this app"
  title="How to use this app"
  (click)="help.emit()"
>?</button>
