<header appHeaderBar
  [settingsOpen]="settingsOpen()"
  (help)="helpOpen.set(true)"
  (toggleSettings)="settingsOpen.set(!settingsOpen())"></header>

<!-- Outside the switch: "this browser cannot speak" is raised at boot, and the
     screen that boots is the chooser. Inside practice it was invisible until
     the learner had already picked an activity and a duration. -->
<div appBanner></div>

<div class="app" appShortcuts
  [enabled]="enabled()"
  [helpOpen]="helpOpen()"
  (closeHelp)="helpOpen.set(false)">
  @switch (flow.screen()) {
    @case ('onboarding') {
      <main class="full"><div appLevelPicker></div></main>
    }
    @case ('chooser') {
      <main appActivityChooser class="full"></main>
    }
    @case ('summary') {
      <main appSessionSummary class="full"></main>
    }
    @default {
      <main appPractice class="full"></main>
    }
  }
</div>

@if (settingsOpen()) {
  <div class="scrim" (click)="settingsOpen.set(false)"></div>
}
<div appSettingsDrawer [open]="settingsOpen()" (close)="settingsOpen.set(false)"></div>

<div appEdgeTip></div>
<div appHelpModal [open]="helpOpen()" (close)="helpOpen.set(false)"></div>
