<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowing</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Shadowing</h1>
  <div class="durations" id="durations">
    <button type="button" data-min="5">5 min</button>
    <button type="button" data-min="10">10 min</button>
    <button type="button" data-min="15">15 min</button>
    <button type="button" data-min="0" aria-pressed="true">&#8734;</button>
  </div>
  <div class="clock" id="clock">00:00</div>
</header>

<div class="app">
  <nav class="decks" id="decks" aria-label="Decks"></nav>

  <main>
    <div class="controls">
      <div class="transport">
        <button type="button" id="play" title="Play/Pause (space) &middot; Repeat current sentence (&larr;)">&#9654; Play</button>
        <button type="button" id="next" title="Next (&rarr;)">&#9197;</button>
        <button type="button" id="shuffle" title="Shuffle">&#8644; shuffle</button>
      </div>
      <div class="sliders">
        <label>speed
          <input type="range" id="rate" min="0.7" max="1.2" step="0.05" value="1">
          <output id="rateOut">1.00&times;</output>
        </label>
        <label>gap
          <input type="range" id="slack" min="0.8" max="1.5" step="0.05" value="1">
          <output id="slackOut">1.00&times;</output>
        </label>
        <label>voice
          <select id="voice"></select>
        </label>
      </div>
    </div>

    <div class="banner" id="banner"></div>
    <div class="lines" id="lines"></div>
  </main>
</div>

<script src="data/data.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
